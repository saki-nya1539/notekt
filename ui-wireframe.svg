<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, monospace">
  <rect x="0" y="0" width="900" height="560" fill="#fafafa"/>

  <rect x="20" y="20" width="860" height="520" rx="10" fill="#1e1e2e" stroke="#333" stroke-width="2"/>
  <rect x="20" y="20" width="860" height="30" rx="10" fill="#2a2a3d"/>
  <circle cx="40" cy="35" r="5" fill="#e08080"/>
  <circle cx="57" cy="35" r="5" fill="#e0c080"/>
  <circle cx="74" cy="35" r="5" fill="#80c080"/>
  <text x="450" y="40" font-size="12" fill="#aaa" text-anchor="middle">notekt — ターミナル</text>

  <text x="40" y="75" font-size="13" fill="#8be9fd">$ kotlin -cp build MainKt add "Kotlin note" --tag kotlin --body "sealed classについて"</text>
  <text x="40" y="95" font-size="13" fill="#50fa7b">added #1: Kotlin note</text>

  <text x="40" y="125" font-size="13" fill="#8be9fd">$ kotlin -cp build MainKt add "Ruby note" --tag ruby</text>
  <text x="40" y="145" font-size="13" fill="#50fa7b">added #2: Ruby note</text>

  <text x="40" y="180" font-size="13" fill="#8be9fd">$ kotlin -cp build MainKt list</text>
  <text x="40" y="200" font-size="13" fill="#f8f8f2">#2 Ruby note [ruby]</text>
  <text x="40" y="220" font-size="13" fill="#f8f8f2">#1 Kotlin note [kotlin]</text>

  <text x="40" y="255" font-size="13" fill="#8be9fd">$ kotlin -cp build MainKt search kotlin</text>
  <text x="40" y="275" font-size="13" fill="#f8f8f2">#1 Kotlin note [kotlin]</text>

  <text x="40" y="310" font-size="13" fill="#8be9fd">$ kotlin -cp build MainKt show 1</text>
  <text x="40" y="330" font-size="13" fill="#f8f8f2">#1: Kotlin note</text>
  <text x="40" y="350" font-size="13" fill="#6272a4">tags: kotlin</text>
  <text x="40" y="385" font-size="13" fill="#f8f8f2">sealed classについて</text>

  <text x="40" y="420" font-size="13" fill="#8be9fd">$ kotlin -cp build MainKt rm 2</text>
  <text x="40" y="440" font-size="13" fill="#50fa7b">removed #2: Ruby note</text>

  <rect x="40" y="470" width="8" height="18" fill="#f8f8f2">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="60" y="485" font-size="13" fill="#6272a4">_</text>

  <text x="450" y="520" font-size="11" fill="#999" text-anchor="middle">NoteKt — Kotlin製CLIメモ管理ツール ワイヤーフレーム</text>
</svg>
